[package]
name = "extractor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "extractor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false}
scraper = "0.19"

[profile.release]
opt-level = 3

[lib]
name = "extractor_lib"
path = "src/lib.rs"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "extraction_bench"
harness = false